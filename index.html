<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce9ee">
  <title>Windows 11 Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'DM Sans', sans-serif;
      color: #202a31;
      background: #c9d7d5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --glass: rgba(246, 249, 249, .86);
      --line: rgba(35, 54, 64, .12);
      --accent: #138ada;
      --shadow: 0 20px 60px rgba(21, 37, 44, .22), 0 2px 8px rgba(21, 37, 44, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; overflow: hidden; }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid #1888d3; outline-offset: 2px; }
    .desktop {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #9cb6ba;
      background-image: var(--wallpaper-image, url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=72'));
      background-position: center 54%;
      background-size: cover;
      animation: appear .65s ease-out both;
    }
    .desktop::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14, 38, 44, .05), transparent 46%, rgba(11, 30, 33, .12)); }
    .desktop-icons { position: absolute; inset: 0; pointer-events: none; }
    .desktop-icon { position: absolute; display: grid; justify-items: center; align-content: start; gap: 5px; width: 78px; min-height: 78px; padding: 7px 4px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: white; text-shadow: 0 1px 4px rgba(0,0,0,.8); cursor: grab; pointer-events: auto; touch-action: none; user-select: none; }
    .desktop-icon:hover, .desktop-icon:focus-visible { background: rgba(224, 241, 247, .22); border-color: rgba(255,255,255,.28); }
    .desk-glyph { display: grid; place-items: center; height: 38px; font-size: 31px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
    .desktop-icon span:last-child { font-size: 12px; line-height: 1.2; text-align: center; }
    .taskbar {
      position: absolute; z-index: 20; inset: auto 0 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      height: 60px; padding: 0 16px; border-top: 1px solid rgba(255,255,255,.47); background: rgba(239, 244, 244, .83);
      backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    }
    .task-left, .tray, .task-center { display: flex; align-items: center; }
    .task-left { min-width: 0; }
    .task-center { justify-content: center; gap: 5px; }
    .tray { justify-content: flex-end; gap: 13px; font-size: 13px; white-space: nowrap; }
    .tray-control, .calendar-button { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border: 0; border-radius: 5px; background: transparent; color: inherit; cursor: pointer; }
    .tray-control:hover, .calendar-button:hover, .weather:hover { background: rgba(255,255,255,.56); }
    .weather { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border: 0; border-radius: 5px; background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
    .weather b { font-size: 14px; font-weight: 500; }
    .task-button { display: grid; place-items: center; position: relative; width: 44px; height: 44px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; transition: background .15s, transform .15s; }
    .task-button:hover, .task-button.active { background: rgba(255,255,255,.78); }
    .task-button:active { transform: scale(.93); }
    .task-button img { width: 23px; height: 23px; object-fit: contain; }
    .win-logo { width: 23px; height: 23px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; transform: skewY(-4deg); }
    .win-logo i { background: var(--accent); }
    .task-app { font-size: 21px; }
    .task-button.running::after { content: ''; position: absolute; bottom: 3px; width: 9px; height: 3px; border-radius: 3px; background: var(--accent); }
    .clock { display: grid; gap: 1px; justify-items: end; font-size: 11px; line-height: 1.3; }
    .clock time:first-child { font-size: 12px; }
    .start-panel {
      position: absolute; z-index: 18; left: 50%; bottom: 70px; width: min(620px, calc(100vw - 24px)); max-height: min(690px, calc(100dvh - 90px));
      padding: 27px 30px 23px; border: 1px solid rgba(255,255,255,.8); border-radius: 9px; background: rgba(246, 248, 249, .91);
      box-shadow: var(--shadow); backdrop-filter: blur(35px) saturate(1.35); -webkit-backdrop-filter: blur(35px) saturate(1.35);
      transform: translate(-50%, 14px) scale(.98); opacity: 0; visibility: hidden; transition: opacity .17s, transform .17s, visibility .17s; overflow: auto;
    }
    .start-panel.open { opacity: 1; visibility: visible; transform: translate(-50%, 0) scale(1); }
    .search { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 13px; border: 1px solid #9bbcd0; border-bottom: 2px solid var(--accent); border-radius: 4px; background: rgba(255,255,255,.8); color: #48616e; }
    .search span { font-size: 20px; }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: #26353e; font: inherit; font-size: 13px; }
    .search input::placeholder { color: #60737d; }
    .start-heading { display: flex; align-items: center; justify-content: space-between; margin: 25px 4px 13px; }
    .start-heading h2 { margin: 0; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; }
    .all-apps { padding: 5px 10px; border: 1px solid #d3dfe3; border-radius: 4px; background: rgba(255,255,255,.67); font-size: 11px; cursor: pointer; }
    .pinned { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); row-gap: 13px; }
    .app-shortcut { display: grid; justify-items: center; gap: 7px; min-width: 0; padding: 8px 3px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; }
    .app-shortcut:hover { background: rgba(211,229,238,.63); }
    .app-shortcut span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .app-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; background: #e2eff8; font-size: 20px; }
    .app-icon.folder { background: #e8eef1; }
    .app-icon.edge { background: #dff2ed; }
    .app-icon.settings { background: #ebeaed; }
    .app-icon.store { background: #e4edf8; }
    .app-icon.photos { background: #f8efdf; }
    .app-icon.mail { background: #e1edf7; }
    .app-icon.notes { background: #f9efc9; }
    .app-icon.calc { background: #e5e8e9; }
    .app-icon.terminal { background: #e5e7e9; }
    .recommended { display: grid; grid-template-columns: 1fr 1fr; column-gap: 17px; row-gap: 5px; }
    .recent { display: flex; align-items: center; gap: 11px; min-width: 0; padding: 8px 5px; border: 0; border-radius: 5px; background: transparent; text-align: left; cursor: pointer; }
    .recent:hover { background: rgba(211,229,238,.63); }
    .recent-icon { display: grid; place-items: center; flex: 0 0 31px; height: 34px; border-radius: 4px; background: #e8f0f3; font-size: 18px; }
    .recent-copy { display: grid; min-width: 0; gap: 3px; }
    .recent-copy b, .recent-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-copy b { font-size: 11px; font-weight: 500; }
    .recent-copy small { color: #65757d; font-size: 9px; }
    .start-footer { display: flex; align-items: center; justify-content: space-between; margin: 23px -30px -23px; padding: 12px 30px; border-top: 1px solid rgba(76,97,109,.12); background: rgba(223,232,235,.6); }
    .profile { display: flex; align-items: center; gap: 9px; font-size: 11px; }
    .avatar { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #d8e7e9; font-size: 16px; }
    .power { width: 34px; height: 32px; border: 0; border-radius: 4px; background: transparent; font-size: 18px; cursor: pointer; }
    .power:hover { background: rgba(255,255,255,.75); }
    .window {
      position: absolute; z-index: 5; top: 12%; left: 21%; display: flex; flex-direction: column; width: min(780px, calc(100vw - 36px)); height: min(530px, calc(100dvh - 115px)); min-height: 300px;
      overflow: hidden; border: 1px solid rgba(255,255,255,.82); border-radius: 7px; background: #f8fafb; box-shadow: var(--shadow); animation: window-in .2s ease-out both;
    }
    .window.maximized { inset: 8px 8px 68px !important; width: auto !important; height: auto !important; }
    .window.fullscreen { inset: 0 !important; z-index: 30 !important; width: 100% !important; height: 100% !important; min-height: 0; border: 0; border-radius: 0; }
    .titlebar { display: flex; align-items: center; flex: 0 0 42px; min-width: 0; padding-left: 14px; background: #f7f9fa; touch-action: none; cursor: grab; user-select: none; }
    .titlebar:active { cursor: grabbing; }
    .window-title { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 11px; }
    .window-title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-menu-toggle { width: 30px; height: 30px; flex: 0 0 auto; border: 0; border-radius: 4px; background: transparent; color: inherit; font-size: 17px; cursor: pointer; }
    .app-menu-toggle:hover, .app-menu-toggle[aria-expanded="true"] { background: rgba(128,150,160,.2); }
    .window-controls { display: flex; align-self: stretch; margin-left: auto; }
    .window-controls button { width: 45px; border: 0; background: transparent; font-size: 14px; cursor: pointer; }
    .window-controls button:hover { background: #e8edef; }
    .window-controls button.close:hover { background: #d83b36; color: white; }
    .app-dropdown { position: absolute; z-index: 40; top: 42px; left: 8px; display: grid; width: 190px; padding: 5px; border: 1px solid #dce4e7; border-radius: 5px; background: #fbfcfc; color: #26353e; box-shadow: var(--shadow); }
    .app-dropdown button { padding: 8px 9px; border: 0; border-radius: 3px; background: transparent; color: inherit; font-size: 11px; text-align: left; cursor: pointer; }
    .app-dropdown button:hover { background: #e8eff2; }
    .app-dropdown hr { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid #e1e7e9; }
    .window-body { flex: 1; min-height: 0; overflow: auto; }
    .embedded-site-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .file-layout { display: grid; grid-template-columns: 175px 1fr; height: 100%; }
    .file-sidebar { padding: 12px 8px; border-right: 1px solid #e6ebed; background: #f4f7f8; }
    .file-nav { display: flex; gap: 9px; align-items: center; width: 100%; padding: 9px 10px; border: 0; border-radius: 4px; background: transparent; color: #3b4c55; font-size: 11px; text-align: left; cursor: pointer; }
    .file-nav.selected, .file-nav:hover { background: #e4edf1; }
    .file-main { padding: 18px 20px; }
    .file-toolbar { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
    .file-toolbar button { padding: 7px 9px; border: 1px solid #d8e1e4; border-radius: 4px; background: #fff; font-size: 10px; cursor: pointer; }
    .file-toolbar button:hover { border-color: var(--accent); }
    .file-toolbar input[type="search"] { flex: 1; min-width: 80px; padding: 7px 9px; border: 1px solid #d8e1e4; border-radius: 4px; font: inherit; font-size: 10px; }
    .address { margin-bottom: 22px; padding: 8px 11px; border: 1px solid #e0e7ea; border-radius: 4px; color: #42535a; font-size: 11px; }
    .file-main h3 { margin: 0 0 13px; font-family: Manrope, sans-serif; font-size: 14px; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px,1fr)); gap: 8px; }
    .file-tile { display: grid; justify-items: center; gap: 8px; min-height: 100px; padding: 14px 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; }
    .file-tile:hover, .file-tile.selected { border-color: #d5e4eb; background: #edf5f7; }
    .file-tile .file-emoji { font-size: 32px; }
    .file-tile span:last-child { font-size: 10px; }
    .file-empty { padding: 24px 8px; color: #78888f; font-size: 11px; text-align: center; }
    .file-editor { display: flex; flex-direction: column; height: calc(100% - 52px); gap: 9px; }
    .file-editor textarea { flex: 1; min-height: 100px; padding: 12px; border: 1px solid #d8e1e4; border-radius: 4px; resize: none; font: 12px/1.6 monospace; }
    .file-editor-actions { display: flex; gap: 7px; }
    .notepad { display: flex; flex-direction: column; height: 100%; background: #fff; }
    .notepad-toolbar { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border-bottom: 1px solid #e4eaec; }
    .notepad-toolbar button { padding: 6px 9px; border: 1px solid #d8e1e4; border-radius: 4px; background: transparent; font-size: 10px; cursor: pointer; }
    .notepad-toolbar button:hover { border-color: var(--accent); }
    .notepad-status { margin-left: auto; color: #718189; font-size: 10px; }
    .notepad textarea { flex: 1; width: 100%; min-height: 0; resize: none; border: 0; outline: 0; padding: 18px 22px; background: transparent; color: #26353e; font: 13px/1.65 'DM Sans',sans-serif; }
    .browser-page { height: 100%; display: flex; flex-direction: column; background: #fff; }
    .chrome-tabstrip { display: flex; align-items: flex-end; gap: 5px; min-height: 37px; padding: 5px 8px 0; background: #e7ecef; }
    .chrome-tablist { display: flex; align-items: flex-end; flex: 1; min-width: 0; gap: 4px; overflow: auto hidden; }
    .chrome-tab { display: flex; align-items: center; gap: 4px; min-width: 86px; max-width: 190px; height: 30px; padding: 0 5px 0 10px; border: 0; border-radius: 6px 6px 0 0; background: #d4dde1; color: #34464f; }
    .chrome-tab[aria-selected="true"] { background: #fff; color: #202a31; }
    .chrome-tab-select { flex: 1; min-width: 0; overflow: hidden; border: 0; background: transparent; color: inherit; font: inherit; font-size: 10px; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .chrome-tab-close, .chrome-new-tab { display: grid; place-items: center; flex: 0 0 23px; width: 23px; height: 23px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; }
    .chrome-tab-close:hover, .chrome-new-tab:hover { background: rgba(65,83,92,.16); }
    .chrome-bookmarks { display: flex; gap: 7px; overflow: auto hidden; min-height: 33px; padding: 4px 10px; border-bottom: 1px solid #e5ebed; background: #fff; }
    .chrome-bookmark { flex: 0 0 auto; max-width: 170px; overflow: hidden; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; color: #34464f; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .chrome-bookmark:hover { background: #eef2f3; }
    .browser-toolbar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-bottom: 1px solid #e5ebed; }
    .browser-toolbar button { border: 0; border-radius: 4px; background: transparent; color: #536770; cursor: pointer; }
    .browser-toolbar button:disabled { opacity: .4; cursor: default; }
    .browser-frame { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
    .browser-address-form { display: flex; align-items: center; flex: 1; min-width: 0; padding: 0 10px; border-radius: 20px; background: #eff3f4; color: #5a6970; }
    .browser-address { width: 100%; min-width: 0; padding: 8px 5px; border: 0; outline: 0; background: transparent; color: #40515a; font: inherit; font-size: 11px; }
    .web-content { display: grid; place-content: center; flex: 1; padding: 24px; text-align: center; }
    .web-content .web-mark { margin-bottom: 12px; color: #1686d3; font-size: 38px; }
    .web-content h2 { margin: 0 0 6px; font-family: Manrope,sans-serif; font-size: 25px; }
    .web-content p { margin: 0 0 20px; color: #6b7a81; font-size: 12px; }
    .web-search-form { display: flex; align-items: center; width: min(450px, 76vw); padding-right: 6px; border: 1px solid #d7e0e3; border-radius: 24px; background: #fff; box-shadow: 0 3px 14px rgba(35,60,70,.09); }
    .web-search { flex: 1; min-width: 0; padding: 13px 17px; border: 0; outline: 0; border-radius: 24px; background: transparent; font: inherit; font-size: 12px; }
    .web-search-form button { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #e8f2f5; color: #226478; font-size: 20px; cursor: pointer; }
    .web-search-form button:hover { background: #d7e9ee; }
    .web-content.search-results { display: block; overflow: auto; text-align: left; }
    .search-results-heading { padding: 12px 4px 18px; border-bottom: 1px solid #e5ebed; }
    .search-results-heading h2 { margin: 0 0 5px; font: 700 20px Manrope,sans-serif; }
    .search-results-heading p { margin: 0; color: #687981; font-size: 11px; overflow-wrap: anywhere; }
    .search-result { padding: 15px 4px; border-bottom: 1px solid #e9eef0; }
    .search-result h3 { margin: 0 0 5px; color: #236b88; font: 600 13px Manrope,sans-serif; }
    .search-result-title { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .search-result-title:hover { text-decoration: underline; }
    .search-result p { margin: 0; color: #4b5c64; font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
    .search-result small { display: block; margin-top: 6px; color: #77868c; font-size: 10px; }
    .search-empty { padding: 20px 4px; color: #65757d; font-size: 12px; }
    .chrome-internal { display: block; overflow: auto; text-align: left; }
    .chrome-internal-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 4px 16px; border-bottom: 1px solid #e5ebed; }
    .chrome-internal-heading h2 { margin: 0; font: 700 20px Manrope,sans-serif; }
    .chrome-internal-heading button, .chrome-internal-row button { padding: 6px 9px; border: 1px solid #d8e1e4; border-radius: 4px; background: transparent; font: inherit; font-size: 10px; cursor: pointer; }
    .chrome-internal-row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid #e9eef0; font-size: 11px; }
    .chrome-internal-row button:first-child { flex: 1; overflow: hidden; border: 0; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .chrome-internal-empty { padding: 18px 4px; color: #718189; font-size: 11px; }
    .settings { height: 100%; overflow: auto; background: #f8fafb; }
    .settings-content { max-width: 760px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 36px); }
    .settings-content h2 { margin: 0 0 6px; font: 700 20px Manrope,sans-serif; }
    .settings-intro { margin: 0 0 22px; color: #687981; font-size: 11px; }
    .settings-section-title { margin: 21px 0 10px; font: 700 13px Manrope,sans-serif; }
    .wallpaper-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .wallpaper-choice { display: grid; gap: 6px; padding: 5px; border: 1px solid #dce4e7; border-radius: 5px; background: #fff; text-align: left; cursor: pointer; }
    .wallpaper-choice[aria-pressed="true"] { border: 2px solid var(--accent); padding: 4px; }
    .wallpaper-preview { display: block; width: 100%; aspect-ratio: 16 / 7; border-radius: 3px; background-position: center; background-size: cover; }
    .wallpaper-choice span:last-child { padding: 2px 4px 4px; font-size: 10px; }
    .wallpaper-custom { display: flex; gap: 7px; margin-top: 10px; }
    .wallpaper-custom input { flex: 1; min-width: 0; padding: 8px 9px; border: 1px solid #d5dfe3; border-radius: 4px; background: #fff; font: inherit; font-size: 10px; }
    .wallpaper-custom button { padding: 7px 10px; border: 1px solid #d5dfe3; border-radius: 4px; background: #fff; font-size: 10px; cursor: pointer; }
    .wallpaper-custom button:hover { border-color: var(--accent); }
    .accent-choices { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .accent-swatch { width: 27px; height: 27px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #bdc9ce; cursor: pointer; }
    .accent-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
    .custom-color { width: 34px; height: 34px; padding: 2px; border: 1px solid #cbd6db; border-radius: 5px; background: white; cursor: pointer; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #e6ebed; font-size: 12px; }
    .setting-row small { display: block; margin-top: 4px; color: #75858c; font-size: 10px; }
    .switch { position: relative; width: 34px; height: 19px; flex: 0 0 auto; appearance: none; border-radius: 12px; background: #b8c4c8; cursor: pointer; transition: background .15s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 13px; height: 13px; border-radius: 50%; background: white; transition: transform .15s; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(15px); }
    .about { display: grid; place-content: center; height: 100%; padding: 30px; color: #5c6b72; text-align: center; }
    .about strong { margin: 8px 0; color: #25343b; font: 700 19px Manrope,sans-serif; }
    .about p { max-width: 350px; font-size: 12px; line-height: 1.65; }
    .cloud-gaming { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: #f4f7f8; }
    .cloud-header { padding: 20px 22px 14px; }
    .cloud-header h2 { margin: 0 0 5px; font: 700 19px Manrope,sans-serif; }
    .cloud-header p { margin: 0; color: #65757d; font-size: 11px; }
    .cloud-toolbar { display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 6px 18px; border-top: 1px solid #e1e8eb; border-bottom: 1px solid #e1e8eb; background: #fff; }
    .cloud-toolbar button { padding: 6px 9px; border: 1px solid #d5dfe3; border-radius: 4px; background: #fff; font-size: 10px; cursor: pointer; }

      desktop.classList.toggle('performance-mode', desktopPreferences.performanceMode);
      const backdrop = desktopPreferences.transparency ? 'blur(24px) saturate(1.4)' : 'none';
      document.querySelectorAll('.start-panel,.taskbar').forEach(element => {
        element.style.backdropFilter = backdrop;
        element.style.webkitBackdropFilter = backdrop;
      });
    }

    function saveDesktopPreferences() {
      try { localStorage.setItem('desktopPreferences', JSON.stringify(desktopPreferences)); } catch {}
    }

    function updateDesktopPreference(name, value) {
      desktopPreferences[name] = value;
      applyDesktopPreferences();
      saveDesktopPreferences();
      if (name === 'nightLight') document.getElementById('nightLightQuick').checked = value;
      if (name === 'brightness') document.getElementById('brightnessRange').value = value;

    function setupDesktopIconPositions() {
      let savedPositions = {};
      try { savedPositions = JSON.parse(localStorage.getItem('desktopIconPositions') || '{}'); } catch {}
      const icons = [...document.querySelectorAll('.desktop-icon[data-icon-id]')];
      const savePositions = () => {
        const positions = Object.fromEntries(icons.map(icon => [icon.dataset.iconId, {
          x: parseFloat(icon.style.left) || 0,
          y: parseFloat(icon.style.top) || 0
        }]));
        try { localStorage.setItem('desktopIconPositions', JSON.stringify(positions)); } catch {}
      };

      icons.forEach((icon, index) => {
        const saved = savedPositions[icon.dataset.iconId];
        const maxX = Math.max(0, desktop.clientWidth - icon.offsetWidth);
        const maxY = Math.max(0, desktop.clientHeight - 68 - icon.offsetHeight);
        const x = Number.isFinite(saved?.x) ? Math.min(maxX, Math.max(0, saved.x)) : 16;
        const y = Number.isFinite(saved?.y) ? Math.min(maxY, Math.max(0, saved.y)) : 18 + index * 85;
        icon.style.left = `${x}px`;
        icon.style.top = `${Math.min(y, maxY)}px`;
        icon.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          event.preventDefault();
          icon.setPointerCapture(event.pointerId);
          const startX = event.clientX;
          const startY = event.clientY;
          const originX = parseFloat(icon.style.left);
          const originY = parseFloat(icon.style.top);
          let moved = false;
          const moveIcon = pointerEvent => {
            const deltaX = pointerEvent.clientX - startX;
            const deltaY = pointerEvent.clientY - startY;
            if (!moved && Math.hypot(deltaX, deltaY) < 4) return;
            moved = true;
            icon.style.cursor = 'grabbing';
            const boundX = Math.max(0, desktop.clientWidth - icon.offsetWidth);
            const boundY = Math.max(0, desktop.clientHeight - 68 - icon.offsetHeight);
            icon.style.left = `${Math.max(0, Math.min(boundX, originX + deltaX))}px`;
            icon.style.top = `${Math.max(0, Math.min(boundY, originY + deltaY))}px`;
          };
          const finishMove = pointerEvent => {
            icon.removeEventListener('pointermove', moveIcon);
            icon.style.cursor = 'grab';
            if (moved && pointerEvent.type === 'pointerup') {
              draggedDesktopIcon = icon;
              savePositions();
              setTimeout(() => { if (draggedDesktopIcon === icon) draggedDesktopIcon = null; }, 0);
            }
          };
          icon.addEventListener('pointermove', moveIcon);
          icon.addEventListener('pointerup', finishMove, { once: true });
          icon.addEventListener('pointercancel', finishMove, { once: true });
        });
      });
    }

    const localFilesKey = 'desktopLocalFiles';
    const defaultLocalFiles = [
      { id: 'folder-documents', name: 'Documents', type: 'folder', parent: 'root', contents: '' },
      { id: 'folder-downloads', name: 'Downloads', type: 'folder', parent: 'root', contents: '' },
      { id: 'folder-pictures', name: 'Pictures', type: 'folder', parent: 'root', contents: '' }
    ];

    function cleanFileName(value) {
      return value.trim().replace(/[\\/]/g, '-').slice(0, 80);
    }

    function createLocalFileEntry(name, type, parent, contents = '') {
      const safeName = cleanFileName(name);
      if (!safeName || !['folder', 'text'].includes(type)) return null;
      return {
        id: globalThis.crypto?.randomUUID?.() || `local-${Date.now()}-${Math.random().toString(36).slice(2)}`,
        name: safeName,
        type,
        parent,
        contents: type === 'text' ? contents : ''
      };
    }

    function loadLocalFiles() {
      try {
        const saved = JSON.parse(localStorage.getItem(localFilesKey) || 'null');
        if (!Array.isArray(saved)) return defaultLocalFiles.map(entry => ({ ...entry }));
        return saved.filter(entry => entry && typeof entry.id === 'string' && typeof entry.name === 'string' && ['folder', 'text'].includes(entry.type) && typeof entry.parent === 'string').map(entry => ({
          id: entry.id,
          name: cleanFileName(entry.name),
          type: entry.type,
          parent: entry.parent,
          contents: entry.type === 'text' && typeof entry.contents === 'string' ? entry.contents : ''
        }));
      } catch {
        return defaultLocalFiles.map(entry => ({ ...entry }));
      }
    }

    function saveLocalFiles(entries) {
      try {
        localStorage.setItem(localFilesKey, JSON.stringify(entries));
        return true;
      } catch {
        notify('Local storage is full. Download files you want to keep, then remove older items.');
        return false;
      }
    }

    function setupFileExplorer(win) {
      let entries = loadLocalFiles();
      let currentFolder = 'root';
      let selectedEntryId = null;
      let activeFileId = null;
      const grid = win.querySelector('#fileGrid');
      const empty = win.querySelector('#fileEmpty');
      const heading = win.querySelector('#fileHeading');
      const breadcrumb = win.querySelector('#fileBreadcrumb');
      const search = win.querySelector('#fileSearch');
      const editor = win.querySelector('#fileEditor');
      const editorText = win.querySelector('#fileEditorText');
      const uploadInput = win.querySelector('#fileUpload');

      function getEntry(id) { return entries.find(entry => entry.id === id); }

      function render() {
        const folder = currentFolder === 'root' ? null : getEntry(currentFolder);
        if (currentFolder !== 'root' && folder?.type !== 'folder') currentFolder = 'root';
        heading.textContent = folder?.name || 'Quick access';
        const pathParts = [];
        let pathEntry = folder;
        while (pathEntry) {
          pathParts.unshift(pathEntry.name);
          pathEntry = pathEntry.parent === 'root' ? null : getEntry(pathEntry.parent);
        }
        breadcrumb.textContent = ['Home', ...pathParts].join('  ›  ');
        win.querySelectorAll('.file-nav[data-folder]').forEach(button => button.classList.toggle('selected', button.dataset.folder === currentFolder));
        const query = search.value.trim().toLowerCase();
        const visibleEntries = entries.filter(entry => entry.parent === currentFolder && entry.name.toLowerCase().includes(query));
        grid.replaceChildren();
        for (const entry of visibleEntries) {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = `file-tile${entry.id === selectedEntryId ? ' selected' : ''}`;
          tile.dataset.fileId = entry.id;
          const icon = document.createElement('span');
          icon.className = 'file-emoji';
          icon.textContent = entry.type === 'folder' ? '📁' : '📄';
          const name = document.createElement('span');
          name.textContent = entry.name;
          tile.append(icon, name);
          grid.append(tile);
        }
        empty.classList.toggle('hidden', visibleEntries.length > 0);
        empty.textContent = query ? 'No matching items in this folder.' : 'This folder is empty.';
      }

      function openTextFile(entry) {
        activeFileId = entry.id;
        grid.classList.add('hidden');
        empty.classList.add('hidden');
        editor.classList.remove('hidden');
        heading.textContent = entry.name;
        editorText.value = entry.contents;
        editorText.focus();
      }

      function addEntry(name, type, contents = '') {
        const entry = createLocalFileEntry(name, type, currentFolder, contents);
        if (!entry) { notify('Enter a name for this item.'); return null; }
        entries.push(entry);
        selectedEntryId = entry.id;
        saveLocalFiles(entries);
        render();
        return entry;
      }

      function finishEditing() {
        activeFileId = null;
        editor.classList.add('hidden');
        grid.classList.remove('hidden');
        render();
      }

      win.querySelectorAll('.file-nav[data-folder]').forEach(button => button.addEventListener('click', () => {
        currentFolder = button.dataset.folder;
        selectedEntryId = null;
        editor.classList.add('hidden');
        grid.classList.remove('hidden');
        render();
      }));
      grid.addEventListener('click', event => {
        const tile = event.target.closest('[data-file-id]');
        if (!tile) return;
        selectedEntryId = tile.dataset.fileId;
        grid.querySelectorAll('.file-tile').forEach(item => item.classList.toggle('selected', item === tile));
      });
      grid.addEventListener('dblclick', event => {
        const tile = event.target.closest('[data-file-id]');
        const entry = tile && getEntry(tile.dataset.fileId);
        if (!entry) return;
        if (entry.type === 'folder') {
          currentFolder = entry.id;
          selectedEntryId = null;
          render();
        } else openTextFile(entry);
      });
      grid.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        const tile = event.target.closest('[data-file-id]');
        const entry = tile && getEntry(tile.dataset.fileId);
        if (!entry) return;
        if (entry.type === 'folder') { currentFolder = entry.id; selectedEntryId = null; render(); }
        else openTextFile(entry);
      });
      search.addEventListener('input', render);
      editorText.addEventListener('input', () => {
        const entry = getEntry(activeFileId);
        if (!entry) return;
        entry.contents = editorText.value;
        saveLocalFiles(entries);
      });
      win.querySelector('.file-toolbar').addEventListener('click', async event => {
        const action = event.target.closest('[data-file-action]')?.dataset.fileAction;
        if (!action) return;
        if (action === 'new-folder' || action === 'new-file') {
          const name = prompt(action === 'new-folder' ? 'Folder name' : 'Text file name', action === 'new-file' ? 'New note.txt' : 'New folder');
          const entry = addEntry(name || '', action === 'new-folder' ? 'folder' : 'text');
          if (entry?.type === 'text') openTextFile(entry);
        }
        if (action === 'upload') uploadInput.click();
        if (action === 'rename') {
          const entry = getEntry(selectedEntryId);
          if (!entry) { notify('Select a file or folder first.'); return; }
          const name = prompt('Rename item', entry.name);
          if (name !== null && cleanFileName(name)) { entry.name = cleanFileName(name); saveLocalFiles(entries); render(); }
        }
        if (action === 'delete') {
          if (!getEntry(selectedEntryId)) { notify('Select a file or folder first.'); return; }
          const removed = new Set([selectedEntryId]);
          let foundChild = true;
          while (foundChild) {
            foundChild = false;
            for (const entry of entries) if (removed.has(entry.parent) && !removed.has(entry.id)) { removed.add(entry.id); foundChild = true; }
          }
          entries = entries.filter(entry => !removed.has(entry.id));
          selectedEntryId = null;
          saveLocalFiles(entries);
          render();
        }
      });
      win.querySelector('.file-editor-actions').addEventListener('click', event => {
        const action = event.target.closest('[data-file-action]')?.dataset.fileAction;
        const entry = getEntry(activeFileId);
        if (action === 'save' && entry) {
          entry.contents = editorText.value;
          saveLocalFiles(entries);
          notify('Saved on this device.');
        }
        if (action === 'download' && entry) {
          const url = URL.createObjectURL(new Blob([editorText.value], { type: 'text/plain;charset=utf-8' }));
          const link = document.createElement('a');
          link.href = url;
          link.download = entry.name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        if (action === 'back') finishEditing();
      });
      uploadInput.addEventListener('change', async () => {
        const uploads = [...uploadInput.files];
        uploadInput.value = '';
        for (const file of uploads) {
          if (file.size > 256 * 1024) { notify(`${file.name} exceeds the 256 KB text-file limit.`); continue; }
          try { addEntry(file.name, 'text', await file.text()); }
          catch { notify(`Could not read ${file.name}.`); }
        }
      });
      render();
    }

    function collectRelatedTopics(topics, entries) {
      if (!Array.isArray(topics)) return;
      for (const topic of topics) {
        if (Array.isArray(topic.Topics)) collectRelatedTopics(topic.Topics, entries);
        else if (topic.Text) entries.push({ title: topic.Text.split(' - ')[0], text: topic.Text, source: 'Related result', url: topic.FirstURL || '' });
      }

    function normalizeWebAddress(value) {
      const address = value.trim();
      if (!address) return '';
      const hasHttpScheme = /^https?:\/\//i.test(address);
      const looksLikeHost = /^(?:localhost|(?:[\w-]+\.)+[a-z]{2,}|(?:\d{1,3}\.){3}\d{1,3})(?::\d+)?(?:[/?#]\S*)?$/i.test(address);
      if (!hasHttpScheme && !looksLikeHost) return '';
      try {
        const url = new URL(hasHttpScheme ? address : `https://${address}`);
        return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
      } catch {
        return '';
      }
    }

    function normalizeChromeInternal(value) {
      try {
        const url = new URL(value.trim());
        return url.protocol === 'chrome:' && url.hostname ? `chrome://${url.hostname.toLowerCase()}${url.pathname === '/' ? '' : url.pathname}` : '';
      } catch { return ''; }
    }

    function loadChromeHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem('desktopChromeHistory') || '[]');
        return Array.isArray(saved) ? saved.filter(entry => entry && typeof entry.title === 'string' && typeof entry.value === 'string' && ['url', 'search'].includes(entry.type)).slice(-100) : [];
      } catch { return []; }
    }

    function recordChromeHistory(win, type, value) {
      if (win.dataset.app !== 'chrome') return;
      const entries = loadChromeHistory();
      entries.unshift({ type, value, title: type === 'search' ? value : (() => { try { return new URL(value).hostname; } catch { return value; } })(), visitedAt: Date.now() });
      try { localStorage.setItem('desktopChromeHistory', JSON.stringify(entries.slice(0, 100))); } catch {}
    }

    function renderChromeInternal(win, route, addHistory = true) {
      const normalized = normalizeChromeInternal(route);
      if (!normalized || win.dataset.app !== 'chrome') return false;
      const page = new URL(normalized).hostname;
      if (page === 'newtab') {
        if (addHistory) pushBrowserHistory(win, { type: 'home', value: '' });
        showBrowserHome(win);
        return true;
      }
      if (addHistory) pushBrowserHistory(win, { type: 'internal', value: normalized });
      win.dataset.searchId = String(++searchSequence);

      delete win.dataset.lastQuery;

      const reader = win.querySelector('[data-browser-reader]');

      content.classList.remove('hidden', 'search-results');
      content.classList.add('chrome-internal');
      content.replaceChildren();
      const header = document.createElement('header');
      header.className = 'chrome-internal-heading';
      const title = document.createElement('h2');
      title.textContent = ({ history: 'History', bookmarks: 'Bookmarks', downloads: 'Downloads', settings: 'Chrome settings', version: 'Chrome version', about: 'About Chrome' })[page] || 'Chrome page';
      header.append(title);
      if (page === 'history') {
        const clear = document.createElement('button');
        clear.type = 'button';
        clear.textContent = 'Clear history';
        clear.addEventListener('click', () => {
          try { localStorage.removeItem('desktopChromeHistory'); } catch {}
          renderChromeInternal(win, normalized, false);
        });
        header.append(clear);
      }
      content.append(header);

      const addRow = (label, detail, action, secondary) => {
        const row = document.createElement('div');
        row.className = 'chrome-internal-row';
        const primary = document.createElement('button');
        primary.type = 'button';
        primary.textContent = label;
        primary.addEventListener('click', action);
        row.append(primary);
        if (detail) {
          const small = document.createElement('small');
          small.textContent = detail;
          row.append(small);
        }
        if (secondary) row.append(secondary);
        content.append(row);
      };

      if (page === 'history') {
        for (const entry of loadChromeHistory()) addRow(entry.title, new Date(entry.visitedAt).toLocaleString(), () => entry.type === 'search' ? searchInBrowser(entry.value, true, 'chrome') : navigateBrowser(win, entry.value));

          remove.addEventListener('click', () => {
            const next = loadChromeBookmarks().filter(item => item.url !== bookmark.url);

            renderChromeInternal(win, normalized, false);

        addRow('Search engine', 'DuckDuckGo instant answers', () => notify('Search provider is configured for this desktop.'));
        addRow('Reader mode', 'Use the Reader button for sites that block embedding', () => notify('Reader mode is available in the address toolbar.'));
        addRow('Desktop appearance', 'Wallpaper, theme, and performance settings', () => openApp('settings'));
      } else if (page === 'version' || page === 'about') {
        addRow('Google Chrome-style desktop browser', 'Running inside the local Windows desktop simulation', () => {});
        addRow('Version', 'Local browser shell · 1.0', () => {});
      } else if (page === 'downloads') {
        addRow('Downloads are kept in this browser session', 'Page downloads are restricted to keep navigation contained.', () => {});
      } else {
        const empty = document.createElement('p');
        empty.className = 'chrome-internal-empty';
        empty.textContent = `The internal page chrome://${page}/ is not implemented in this desktop.`;
        content.append(empty);
      }
      if (!content.querySelector('.chrome-internal-row')) {

      const tab = getActiveChromeTab(win);
      if (!tab) return;
      const entry = tab.history.entries[tab.history.index];
      if (!entry || entry.type === 'home') tab.title = 'New tab';

      const state = chromeTabStates.get(win);
      if (!state) return;

    function pushBrowserHistory(win, entry) {
      const history = getBrowserHistory(win);
      history.entries = history.entries.slice(0, history.index + 1);
      history.entries.push(entry);
      history.index = history.entries.length - 1;
      updateBrowserHistoryButtons(win);
      updateChromeTabTitle(win);
      const activeTab = getActiveChromeTab(win);
      if (activeTab) {
        activeTab.history = history;

      }
    }

      const history = getBrowserHistory(win);
      history.index = Math.max(0, Math.min(history.entries.length - 1, history.index + direction));

      if (!entry) return;
      updateBrowserHistoryButtons(win);
      if (entry.type === 'home') showBrowserHome(win);
      if (entry.type === 'url') navigateBrowser(win, entry.value, false);

    function renderSearchResults(win, query, data, message = '') {
      const content = win.querySelector('.web-content');
      win.querySelector('.browser-frame').classList.add('hidden');
      content.classList.remove('hidden');
      content.classList.add('search-results');
      content.replaceChildren();
      const heading = document.createElement('header');
      heading.className = 'search-results-heading';
      const title = document.createElement('h2');
      title.textContent = 'Search results';
      const caption = document.createElement('p');
      caption.textContent = query;
      heading.append(title, caption);
      content.append(heading);
      if (message) {
        const empty = document.createElement('p');
        empty.className = 'search-empty';
        empty.textContent = message;
        content.append(empty);
        return;
      }

      const entries = [];
      if (data.Answer) entries.push({ title: data.Heading || 'Quick answer', text: data.Answer, source: data.AnswerType || 'Answer', url: data.AnswerURL || '' });
      if (data.Abstract) entries.push({ title: data.Heading || query, text: data.Abstract, source: data.AbstractSource || 'Summary', url: data.AbstractURL || '' });
      if (data.Definition) entries.push({ title: data.Heading || 'Definition', text: data.Definition, source: data.DefinitionSource || 'Definition', url: data.DefinitionURL || '' });
      if (Array.isArray(data.Results)) {
        for (const result of data.Results) if (result.Text) entries.push({ title: result.Text.split(' - ')[0], text: result.Text, source: 'Web result', url: result.FirstURL || '' });
      }
      collectRelatedTopics(data.RelatedTopics, entries);
      for (const entry of entries.slice(0, 8)) {
        const article = document.createElement('article');
        article.className = 'search-result';
        const resultTitle = document.createElement('h3');
        const destination = normalizeWebAddress(typeof entry.url === 'string' ? entry.url : '');
        if (destination) {
          const link = document.createElement('button');
          link.type = 'button';
          link.className = 'search-result-title';
          link.textContent = entry.title;
          link.addEventListener('click', () => navigateBrowser(win, destination));
          resultTitle.append(link);
        } else resultTitle.textContent = entry.title;
        const resultText = document.createElement('p');
        resultText.textContent = entry.text;
        const source = document.createElement('small');
        source.textContent = entry.source;
        article.append(resultTitle, resultText, source);
        content.append(article);
      }
      if (!entries.length) {
        const empty = document.createElement('p');
        empty.className = 'search-empty';
        empty.textContent = 'No quick results found. Try another search.';
        content.append(empty);
      }
    }

    async function searchInBrowser(value, addHistory = true, app = 'browser') {
      const query = value.trim();
      if (!query) return;
      const win = openApp(app);
      if (addHistory) pushBrowserHistory(win, { type: 'search', value: query });
      if (addHistory) recordChromeHistory(win, 'search', query);
      delete win.dataset.currentUrl;
      delete win.dataset.readerMode;
      const readerButton = win.querySelector('[data-browser-reader]');
      readerButton.disabled = true;
      readerButton.setAttribute('aria-pressed', 'false');
      updateChromeBookmarkButton(win);
      win.dataset.lastQuery = query;
      updateChromeTabTitle(win);
      const requestId = String(++searchSequence);
      win.dataset.searchId = requestId;
      win.querySelector('.browser-address').value = query;
      renderSearchResults(win, query, {}, 'Searching…');
      const endpoint = new URL('https://api.duckduckgo.com/');
      endpoint.searchParams.set('q', query);
      endpoint.searchParams.set('format', 'json');
      endpoint.searchParams.set('no_html', '1');
      endpoint.searchParams.set('skip_disambig', '1');
      try {
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error('Search request failed');
        const data = await response.json();
        if (win.isConnected && win.dataset.searchId === requestId) renderSearchResults(win, query, data);
      } catch {
        if (win.isConnected && win.dataset.searchId === requestId) renderSearchResults(win, query, {}, 'Search is temporarily unavailable. Check your connection and try again.');
      }
    }

    function openApp(app) {

        event.stopPropagation();

        if (action === 'fullscreen') win.classList.toggle('fullscreen');
        if (action === 'maximize') {
          win.classList.remove('fullscreen');
          win.classList.toggle('maximized');
          win.style.zIndex = ++topZ;
        }
        if (action === 'settings') openApp('settings');
        if (action === 'minimize') {
          win.classList.add('minimized');
          win.style.display = 'none';
        }
        if (action === 'close') {
          win.remove();

          updateRunningApps();

      win.addEventListener('keydown', event => {

          appMenu.classList.add('hidden');

          const value = form.querySelector('input').value;
          const internal = app === 'chrome' && form.matches('.browser-address-form') ? normalizeChromeInternal(value) : '';
          const address = form.matches('.browser-address-form') ? normalizeWebAddress(value) : '';

          else if (address) navigateBrowser(win, address);

    function makeDraggable(win) {
      const bar = win.querySelector('.titlebar');
      bar.addEventListener('pointerdown', event => {
        if (event.target.closest('.window-controls') || win.classList.contains('maximized') || win.classList.contains('fullscreen')) return;
        const rect = win.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        const offsetY = event.clientY - rect.top;
        bar.setPointerCapture(event.pointerId);
        const move = pointer => {
          win.style.left = `${Math.max(0, Math.min(innerWidth - 90, pointer.clientX - offsetX))}px`;
          win.style.top = `${Math.max(0, Math.min(innerHeight - 100, pointer.clientY - offsetY))}px`;
        };
        bar.addEventListener('pointermove', move);
        bar.addEventListener('pointerup', () => bar.removeEventListener('pointermove', move), { once: true });
      });
      bar.addEventListener('dblclick', event => {
        if (event.target.closest('.window-controls')) return;
        win.classList.remove('fullscreen');
        win.classList.toggle('maximized');
        win.style.zIndex = ++topZ;
      });
    }

    function setupCalculator(win) {
      let display = '0';
      let stored = null;
      let operator = null;
      let fresh = true;
      const output = win.querySelector('#calcDisplay');
      win.querySelectorAll('.calc-key').forEach(button => button.addEventListener('click', () => {
        const key = button.textContent;
        if (/^\d$/.test(key) || key === '.') {
          display = fresh ? (key === '.' ? '0.' : key) : (key === '.' && display.includes('.') ? display : display + key);
          fresh = false;
        } else if (['+','−','×','÷'].includes(key)) { stored = Number(display); operator = key; fresh = true; }
        else if (key === '=') {
          const current = Number(display);
          if (operator === '+') display = String(stored + current);
          if (operator === '−') display = String(stored - current);
          if (operator === '×') display = String(stored * current);
          if (operator === '÷') display = current === 0 ? 'Cannot divide by zero' : String(stored / current);
          operator = null; fresh = true;
        } else if (key === 'C' || key === 'CE') { display = '0'; stored = null; operator = null; fresh = true; }
        else if (key === '±') display = String(-Number(display));
        else if (key === '%') display = String(Number(display) / 100);
        output.textContent = display;
      }));
      win.addEventListener('keydown', event => {
        if (event.target.closest('input,textarea,[contenteditable="true"]')) return;
        let key = event.key;
        if (key === 'Enter') key = '=';
        if (key === 'Escape' || key === 'Backspace') key = 'C';
        if (key === '*') key = '×';
        if (key === '/') key = '÷';
        if (key === '-') key = '−';
        const button = [...win.querySelectorAll('.calc-key')].find(item => item.textContent === key);
        if (button) { event.preventDefault(); button.click(); }
      });
    }

    function setupNotepad(win) {
      const textarea = win.querySelector('#notepadText');
      const status = win.querySelector('#noteStatus');
      const count = win.querySelector('#noteCount');
      try { textarea.value = localStorage.getItem('desktopNotepad') || ''; } catch {}
      function updateNotepad() {
        const words = textarea.value.trim().match(/\S+/g) || [];
        count.textContent = `${words.length} words · ${textarea.value.length} characters`;
        try {
          localStorage.setItem('desktopNotepad', textarea.value);
          status.textContent = 'Saved locally';
        } catch {
          status.textContent = 'Storage full';
        }
      }
      textarea.addEventListener('input', updateNotepad);
      win.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          updateNotepad();
        }
      });
      win.querySelector('[data-note-action="download"]').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([textarea.value], { type: 'text/plain;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'notes.txt';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      win.querySelector('[data-note-action="clear"]').addEventListener('click', () => {
        textarea.value = '';
        updateNotepad();
        textarea.focus();
      });
      updateNotepad();
    }

    let calendarCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    function renderCalendar() {
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      document.getElementById('calendarMonth').textContent = calendarCursor.toLocaleDateString([], { month: 'long', year: 'numeric' });
      const days = document.getElementById('calendarDays');
      days.replaceChildren();
      const firstWeekday = new Date(year, month, 1).getDay();
      const dayCount = new Date(year, month + 1, 0).getDate();
      for (let blank = 0; blank < firstWeekday; blank++) {
        const emptyDay = document.createElement('span');
        emptyDay.className = 'calendar-blank';
        days.append(emptyDay);
      }
      for (let day = 1; day <= dayCount; day++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'calendar-day';
        button.textContent = String(day);
        const isSelected = selectedCalendarDate.getFullYear() === year && selectedCalendarDate.getMonth() === month && selectedCalendarDate.getDate() === day;
        button.classList.toggle('selected', isSelected);
        button.setAttribute('aria-pressed', String(isSelected));
        button.addEventListener('click', () => {
          selectedCalendarDate = new Date(year, month, day);
          document.getElementById('calendarSelection').textContent = selectedCalendarDate.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
          renderCalendar();
        });
        days.append(button);
      }
      document.getElementById('calendarSelection').textContent = selectedCalendarDate.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

      const now = new Date();
      document.getElementById('clockTime').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('clockDate').textContent = now.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 15000);
  </script>
</body>
</html>
